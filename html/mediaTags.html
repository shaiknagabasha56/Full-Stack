<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>MediaTags</title>
    </head>
    <body>
        <main>
            <div>
            <img src="./media/me.png" alt="image" height="400" width="1340">
            <a href="github.com/shaiknagabasha56">
            <img src="./media/f2car.jpeg" alt="image" height="400" width="1340">
            </a>
            <img src="./media/road.jpg" alt="image" height="400" width="1340" loading="lazy">
            <img src="./media/sunset.png" alt="image" height="400" width="1340" loading="lazy">
            </div>
            <table>
                <tbody>
                    <tr>
                        <td><img src="./media/background.jpg" alt="image" height="400" width="440"></td>
                        <td><img src="./media/background.jpg" alt="image" height="400" width="440"></td>
                        <td><img src="./media/background.jpg" alt="image" height="400" width="440"></td>
                    </tr>
                    <tr>
                        <td><img src="./media/background.jpg" alt="image" height="400" width="440"></td>
                        <td><img src="./media/background.jpg" alt="image" height="400" width="440"></td>
                        <td><img src="./media/background.jpg" alt="image" height="400" width="440"></td>
                    </tr>

                </tbody>
            </table>


            <figure>
                <figcaption>Nagabasha Shaik</figcaption>
                <img src="./media/me.png" alt="image" height="400" width="700">
            </figure>
        </main>

        <section>
            <header>
                <h3>Video player</h3>
            </header>

            <video controls width="600" poster="./media/hacker.png" muted>
                <source src="./media/website.webm" type="video/webm">
                your browser doesnt support video format
                <source src="./media/website.mp4" type="video/mp4">
            </video>
        </section>

        <section>
            <header>
                <h3>Audio Player</h3>
            </header>
            <audio controls>
                <source src="./media/Garuda-Gamana-Tava.mp3" type="audio/mp3">
                your browser doesnt support audio format
                <source src="./media/Garuda-Gamana-Tava.ogg" type="audio/ogg">
            </audio>
        </section>

        <section>
            <header>
                <h3>Inline Frame</h3>
            </header>
            <iframe
            src="./media/website.webm"
            width="600"
            height="400"
            title="external video player"
            ></iframe>

        </section>

    </body>
</html>
